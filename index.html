<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kadam Clash – territory runner</title>
  
  <!-- Leaflet & Turf -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  
  <!-- Howler for sounds (optional) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
  
  <!-- Custom styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="map"></div>

  <!-- LEADERBOARD MODAL -->
  <div class="modal-overlay" id="leaderboardModal">
    <div class="leaderboard-modal">
      <h3>🏆 LEADERBOARD</h3>
      <div id="leaderboardList" class="leaderboard-list"></div>
      <button class="modal-close" id="closeLeaderboardBtn">CLOSE</button>
    </div>
  </div>

  <!-- MY TERRITORIES MODAL -->
  <div class="modal-overlay" id="myTerritoriesModal">
    <div class="leaderboard-modal" style="max-width: 380px;">
      <h3>🗺️ MY TERRITORIES</h3>
      <div id="myTerritoriesList" class="territory-list"></div>
      <button class="modal-close" id="closeMyTerritoriesBtn">CLOSE</button>
    </div>
  </div>

  <!-- SIDE MENU OVERLAY -->
  <div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>

  <!-- SIDE MENU -->
  <div class="side-menu" id="sideMenu">
    <h2>⚡ KADAM</h2>
    
    <div class="menu-item" id="menuRunToWin">
      <span class="icon">🏆</span> Run to Win
    </div>
    <div class="menu-item" id="menuMyTerritories">
      <span class="icon">🗺</span> My Territories
    </div>
    <div class="menu-item" id="menuLeaderboard">
      <span class="icon">🥇</span> Leaderboard
    </div>
    <div class="menu-item" id="menuMyProfile">
      <span class="icon">👤</span> My Profile
    </div>
    <div class="menu-item" id="toggleSound">
      <span class="icon">🔊</span> Sound <span id="soundStatus">ON</span>
    </div>
    <div class="profile-section">
      <span id="profileUsername">(not logged in)</span>
    </div>
  </div>

  <!-- TOP BAR – only hamburger -->
  <div class="top-bar">
    <div class="menu-btn" onclick="toggleMenu()">
      <div></div>
    </div>
  </div>

  <!-- COLLAPSIBLE BOTTOM RUN CARD -->
  <div class="run-card-container" id="runCardContainer">
    <div class="run-card" id="runCard">
      <div class="card-handle" id="cardHandle">
        <div class="handle-left">
          <div class="distance-row">
            <span class="distance-number-small" id="handleDistance">0.00</span>
            <span class="distance-unit-small">km</span>
          </div>
          <div class="mini-stats" id="miniStats">
            <span>⏱️ <span id="handleDuration">00:00</span></span>
            <span>⚡ <span id="handleSpeed">0.0</span> km/h</span>
          </div>
        </div>
        <div class="handle-right" id="collapseChevron">▼</div>
      </div>
      <div class="card-content" id="cardContent">
        <div class="runner-row">
          <span class="runner-name" id="runnerDisplay">Start <small>runner</small></span>
          <span class="runner-status" id="runStatus">idle</span>
        </div>
        <div class="distance-compact">
          <span class="distance-number" id="distance">0.00</span>
          <span class="distance-unit">km</span>
        </div>
        <div class="location-line">
          <span class="dot"></span>
          <span id="runLocation">acquiring GPS…</span>
        </div>
        <div class="stats-row">
          <div class="stat-item">
            <div class="stat-label">DURATION</div>
            <div class="stat-value" id="duration">00:00</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">LAPS</div>
            <div class="stat-value" id="laps">0</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">SPEED</div>
            <div class="stat-value" id="avgSpeed">0.0</div>
            <span class="stat-unit">km/h</span>
          </div>
        </div>
        <button class="run-action-btn" id="runBtn" onclick="toggleRun()" disabled>
          ▶ START RUN
        </button>
        <div class="hint-text" id="runHint">
          👤 select profile to begin
        </div>
        <div class="extra-controls">
          <button id="fullscreenBtn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast container (gamified) -->
  <div id="toast" class="toast"></div>

  <!-- Confetti canvas (hidden by default) -->
  <canvas id="confettiCanvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; display: none;"></canvas>

  <!-- Lap celebration popup -->
  <div id="lapPopup" class="lap-popup">LAP 1</div>

  <div id="userSelector"></div>

  <!-- Custom script -->
  <script src="script.js" defer></script>
</body>
</html>
